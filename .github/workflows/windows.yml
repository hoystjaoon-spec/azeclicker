name: build-windows

# Builds the Windows release exe with the full MSVC toolchain on GitHub's runners
# (icon embedded, ~18 MB, standalone) and publishes it as a GitHub release.
# Push a version tag (e.g. v2.2.0) to build + publish; or run manually to just build.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      - name: stage exe
        run: Copy-Item target\release\aze_clicker.exe aze_clicker.exe

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aze_clicker-exe
          path: aze_clicker.exe

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: aze_clicker.exe
          body: AZE CLICKER build.
